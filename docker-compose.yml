version: "3.9"

# ── Single container — Frontend + Backend + AI Model ─────────────────────────
# Build:  docker compose build
# Run:    docker compose up
# Access: http://localhost        → Frontend
#         http://localhost:5000   → Backend API
#         http://localhost:7860   → AI Model
# ─────────────────────────────────────────────────────────────────────────────

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile.all
      args:
        VITE_API_URL: "https://ajayfeedback-backend-5jk8.onrender.com"
        VITE_API_BASE: "https://ajayfeedback-backend-5jk8.onrender.com"
        VITE_GOOGLE_CLIENT_ID: "32902780570-ltgii8ds5cf6pp8elj3uapsao7a78u88.apps.googleusercontent.com"
    container_name: feedback-app
    restart: unless-stopped
    ports:
      - "80:80"
      - "5000:5000"
      - "7860:7860"
    env_file:
      - ./backend/.env
    volumes:
      - uploads:/app/uploads

volumes:
  uploads:
