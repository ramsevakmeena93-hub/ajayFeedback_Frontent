name: Build & Push Frontend Docker Image

on:
  push:
    branches: [ master, main ]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.js'
      - 'package.json'
      - 'Dockerfile'
      - 'nginx.standalone.conf'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/feedback-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/feedback-frontend:${{ github.sha }}
          build-args: |
            VITE_API_URL=https://ajayfeedback-backend-5jk8.onrender.com
            VITE_API_BASE=https://ajayfeedback-backend-5jk8.onrender.com
            VITE_GOOGLE_CLIENT_ID=32902780570-ltgii8ds5cf6pp8elj3uapsao7a78u88.apps.googleusercontent.com
          cache-from: type=gha
          cache-to: type=gha,mode=max
