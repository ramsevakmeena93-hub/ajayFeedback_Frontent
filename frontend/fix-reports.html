<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fix Faculty Reports</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 600px;
      width: 100%;
      padding: 40px;
    }
    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }
    p {
      color: #666;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    input {
      width: 100%;
      padding: 15px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 15px;
      transition: border-color 0.3s;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
    }
    button {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
    }
    button:active {
      transform: translateY(0);
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }
    #result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      display: none;
    }
    #result.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    #result.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .info {
      background: #e7f3ff;
      border-left: 4px solid #2196F3;
      padding: 15px;
      border-radius: 5px;
      margin-bottom: 20px;
    }
    .info strong {
      color: #1976D2;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔧 Fix Faculty Reports</h1>
    <p>This will link all reports to their respective faculty members by matching names.</p>
    
    <div class="info">
      <strong>⚠️ Important:</strong> You need to be logged in as HOD or Admin. Get your token from browser localStorage.
    </div>

    <input 
      type="password" 
      id="token" 
      placeholder="Paste your auth token here..."
      autocomplete="off"
    />
    
    <button id="fixBtn" onclick="runFix()">
      🚀 Fix All Reports
    </button>

    <div id="result"></div>
  </div>

  <script>
    // Try to auto-fill token from localStorage
    window.onload = function() {
      try {
        const auth = JSON.parse(localStorage.getItem('auth') || '{}');
        if (auth.token) {
          document.getElementById('token').value = auth.token;
        }
      } catch (e) {
        console.log('No auth token found in localStorage');
      }
    };

    async function runFix() {
      const token = document.getElementById('token').value.trim();
      const btn = document.getElementById('fixBtn');
      const result = document.getElementById('result');

      if (!token) {
        result.className = 'error';
        result.style.display = 'block';
        result.innerHTML = '❌ Please enter your auth token';
        return;
      }

      btn.disabled = true;
      btn.textContent = '⏳ Fixing reports...';
      result.style.display = 'none';

      try {
        const response = await fetch('https://ajayfeedback-backend-5jk8.onrender.com/api/reports/admin/fix-faculty-userids', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          }
        });

        const data = await response.json();

        if (response.ok) {
          result.className = 'success';
          result.style.display = 'block';
          result.innerHTML = `
            <strong>✅ Success!</strong><br>
            <br>
            📊 Total reports checked: ${data.total}<br>
            ✅ Fixed: ${data.fixed}<br>
            ❌ Failed: ${data.failed}<br>
            <br>
            ${data.results && data.results.length > 0 ? `
              <strong>Sample results:</strong><br>
              <pre style="background: #f5f5f5; padding: 10px; border-radius: 5px; margin-top: 10px; overflow-x: auto; font-size: 11px;">${JSON.stringify(data.results.slice(0, 5), null, 2)}</pre>
            ` : ''}
          `;
        } else {
          throw new Error(data.error || 'Failed to fix reports');
        }
      } catch (error) {
        result.className = 'error';
        result.style.display = 'block';
        result.innerHTML = `
          <strong>❌ Error:</strong><br>
          ${error.message}<br>
          <br>
          <small>Make sure you're logged in as HOD or Admin and using the correct token.</small>
        `;
      } finally {
        btn.disabled = false;
        btn.textContent = '🚀 Fix All Reports';
      }
    }
  </script>
</body>
</html>
